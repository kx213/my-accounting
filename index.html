<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#4FB3A9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="轻量级个人记账 Web 应用" />
  <title>口袋账本 · 个人记账</title>

  <link rel="stylesheet" href="./css/style.css" />

  <!-- Vue 3 CDN（多个源 fallback，避免单一镜像被墙导致 404） -->
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js" crossorigin="anonymous"></script>
  <script>
    // Vue 加载失败时给出明显提示
    if (typeof Vue === 'undefined') {
      document.addEventListener('DOMContentLoaded', function () {
        var d = document.createElement('div');
        d.style.cssText = 'padding:24px;color:#E85D5D;font-family:sans-serif;line-height:1.7';
        d.innerHTML = '<h3>Vue 加载失败</h3><p>请检查网络后刷新。也可以本地下载 vue.global.prod.js 放到 ./js/vendor/ 目录。</p>';
        document.body.appendChild(d);
      });
    }
  </script>

  <!-- ECharts CDN（带 fallback） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app">
    <!-- 兜底：JS 还没加载完时给个提示 -->
    <div id="boot-loading" style="padding:80px 24px;text-align:center;color:#6B7280;font-family:sans-serif">
      <div style="font-size:48px;margin-bottom:12px">📒</div>
      <div>口袋账本加载中…</div>
    </div>
  </div>

  <!-- 业务脚本（按依赖顺序加载） -->
  <script src="./js/utils.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/components/home.js"></script>
  <script src="./js/components/records.js"></script>
  <script src="./js/components/stats.js"></script>
  <script src="./js/components/budget.js"></script>
  <script src="./js/components/profile.js"></script>
  <script src="./js/components/category-manage.js"></script>
  <script src="./js/components/book-manage.js"></script>
  <script src="./js/components/record-detail.js"></script>
  <script src="./js/app.js"></script>

  <script>
    (function () {
      // 移除 loading 占位
      var boot = document.getElementById('boot-loading');
      if (boot) boot.remove();

      if (typeof Vue === 'undefined') {
        document.getElementById('app').innerHTML =
          '<div style="padding:24px;color:#E85D5D;font-family:sans-serif">' +
          '<h3>Vue 未加载</h3><p>无法启动应用，请检查网络。</p></div>';
        return;
      }
      if (typeof window.App === 'undefined') {
        document.getElementById('app').innerHTML =
          '<div style="padding:24px;color:#E85D5D;font-family:sans-serif">' +
          '<h3>组件加载失败</h3><p>window.App 未定义。请打开浏览器控制台查看具体哪个 JS 加载失败。</p></div>';
        return;
      }

      // ========== 关键：注册所有组件 ==========
      // Vue 3 不会自动把 window.X 当组件解析，必须显式 app.component()
      var app = Vue.createApp(window.App);
      app.config.globalProperties.Utils = window.Utils;
      app.config.globalProperties.Storage = window.Storage;
      app.config.globalProperties.app = app;

      // 注册每个组件（容错：缺失则跳过）
      var COMPONENTS = ['Home','Records','Stats','Budget','Profile','CategoryManage','BookManage','RecordDetail'];
      COMPONENTS.forEach(function (name) {
        if (window[name]) {
          app.component(name, window[name]);
        } else {
          console.error('[启动] 缺失组件：', name);
        }
      });

      // 容错：组件渲染出错时打印并 toast
      app.config.errorHandler = function (err, instance, info) {
        console.error('[Vue error]', info, err);
        if (window.Utils && Utils.toast) {
          Utils.toast('页面渲染出错：' + (err && err.message ? err.message : err), 'error');
        }
      };

      app.mount('#app');

      console.log('%c 口袋账本 V1.0 ', 'background: #4FB3A9; color: white; padding: 4px 8px; border-radius: 4px;');
      console.log('数据存储：localStorage（请定期导出备份）');
    })();
  </script>
</body>
</html>
